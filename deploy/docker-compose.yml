services:
  # ============================================
  # MySQL Database
  # ============================================
  db:
    image: mysql:8.0
    container_name: ai-aggregator-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Ai@ggregator2024}
      MYSQL_DATABASE: ${DB_NAME:-ai_aggregator}
      MYSQL_USER: ${DB_USER:-ai_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Ai@User2024}
  #    ports:
  #- "${DB_PORT:-3306}:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - ai-aggregator-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-Ai@ggregator2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ============================================
  # MinIO Object Storage
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: ai-aggregator-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      # Public URL used when generating presigned URLs.
      # Set to your domain in production, e.g. https://minio.example.com
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./minio_data:/data
    networks:
      - ai-aggregator-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  # ============================================
  # Redis —— Loop Harness 队列 + 未来 checkpointer
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ai-aggregator-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    networks:
      - ai-aggregator-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/dockerfiles/Dockerfile.backend
    image: ai-aggregator-backend:local
    container_name: ai-aggregator-backend
    restart: unless-stopped
    # Single source of truth: all effective vars come from deploy/.env.
    # The explicit `environment:` block below overrides container-internal
    # topology values (DATABASE_URL / REDIS_URL / MINIO_ENDPOINT).
    env_file:
      - .env
    environment:
      # Database
      DATABASE_URL: "mysql+aiomysql://${DB_USER:-ai_user}:${DB_PASSWORD_URLENCODED:-Ai%40User2024}@db:${DB_PORT:-3306}/${DB_NAME:-ai_aggregator}"
      # Security
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production-2024}
      # AI Aggregation Gateway (single token for all models)
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-https://neolink.com/api/v1}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      # CORS
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:80}
      # Credits
      DEFAULT_CREDITS: ${DEFAULT_CREDITS:-200}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # MinIO Object Storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-aggregator}
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      # Redis (Loop Harness 队列)
      REDIS_URL: redis://redis:6379/0
      # Public endpoint (host:port, no scheme) used when generating presigned URLs
      # so the URLs contain a hostname that browsers can reach.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      # Public origin of this backend, used to build token-signed streaming URLs
      # for external services (Seedance reference video/audio).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    networks:
      - ai-aggregator-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # Harness Worker —— Loop Harness 执行器（arq，复用 backend 镜像）
  # ============================================
  harness-worker:
    image: ai-aggregator-backend:local
    container_name: ai-aggregator-harness-worker
    restart: unless-stopped
    command: arq app.harness.worker.WorkerSettings
    # Same single source of truth as backend; environment: overrides topology.
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql+aiomysql://${DB_USER:-ai_user}:${DB_PASSWORD_URLENCODED:-Ai%40User2024}@db:${DB_PORT:-3306}/${DB_NAME:-ai_aggregator}"
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production-2024}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-https://neolink.com/api/v1}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-aggregator}
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./storage:/app/storage
    networks:
      - ai-aggregator-network
    healthcheck:
      # worker 不起 HTTP 服务，覆盖镜像里 baked 的 curl:8000 健康检查，改查 arq 进程存活
      test: ["CMD-SHELL", "pgrep -f 'app.harness.worker' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  # ============================================
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/dockerfiles/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: ai-aggregator-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - ai-aggregator-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# Volumes
# ============================================

# ============================================
# Networks
# ============================================
networks:
  ai-aggregator-network:
    driver: bridge
